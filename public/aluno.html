<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Área do Aluno — Kinusty Volleyball</title>
  <link rel="icon" href="/img/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/intro.js"></script>
</head>
<body>
  <div class="mobile-bar">
    <button id="abrir-menu" aria-label="Abrir menu">☰</button>
    <a href="/" class="marca"><img src="/img/logo.png" alt="" style="width:34px;height:34px"><span>KINUSTY</span></a>
    <span style="width:30px"></span>
  </div>
  <div class="app">
    <aside class="lateral">
      <a href="/" class="marca"><img src="/img/logo.png" alt=""><span>KINUSTY<small>ÁREA DO ALUNO</small></span></a>
      <nav class="menu">
        <button data-aba="inicio"><span class="ic">🏠</span>Início</button>
        <button data-aba="mensalidades"><span class="ic">💳</span>Mensalidades <span class="contador oculto" id="cont-mens"></span></button>
        <button data-aba="frequencia"><span class="ic">📅</span>Frequência</button>
        <button data-aba="plano"><span class="ic">🏐</span>Meu plano</button>
        <button data-aba="avisos"><span class="ic">📣</span>Avisos</button>
        <button data-aba="perfil"><span class="ic">👤</span>Meus dados</button>
      </nav>
      <div class="usuario-box"><div class="avatar" id="avatar"></div><div><strong id="nome-usuario"></strong><small>Aluno(a)</small></div></div>
      <button class="btn btn-ghost btn-sm" onclick="sair()">Sair</button>
    </aside>
    <main class="conteudo" id="conteudo"></main>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/seletor.js"></script>
  <script src="/js/aluno.js"></script>
</body>
</html>
