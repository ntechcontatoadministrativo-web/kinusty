# Visita o site a cada ~5 minutos para o plano grátis do Render não "dormir".
# Para trocar o endereço, edite SITE_URL abaixo.
name: Manter site acordado

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

env:
  SITE_URL: https://kinusty-volei.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visitar o site
        run: |
          # Visita só a página inicial (não usa o banco, para a Neon poder hibernar).
          # Se o site estiver dormindo, a primeira resposta pode levar ~50 s.
          curl -fsS -o /dev/null -w "HTTP %{http_code} em %{time_total}s\n" \
            --max-time 120 --retry 3 --retry-delay 10 --retry-all-errors \
            "$SITE_URL/"
